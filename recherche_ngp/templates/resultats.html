<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Résultats — Recherche NGP</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <p><a href="/">← Nouvelle recherche</a></p>
    <h1>Résultats pour "{{ mot }}"</h1>
    <p>{{ nombre }} résultat(s) trouvé(s)</p>
    <ul>
    {% for p in resultats %}
        <li><strong>{{ p.ngp }}</strong> — {{ p.designation }} (DD {{ p.dd }}%, TVA {{ p.tva }}%)</li>
    {% endfor %}
    </ul>
</body>
</html>
